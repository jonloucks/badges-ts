name: main-push-publish

on:
  workflow_run:
    workflows: [main-push]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    # Security: Only run when the triggering push workflow succeeded, it is the
    # first attempt, it came from a push event on this repository, and it was not
    # triggered by a fork. We still check out only trusted repository branches and
    # then write to the repository's gh-pages and badges branches.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.fork == false
    runs-on: ubuntu-latest

    steps:
      - name: Verify trusted push workflow
        env:
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "Workflow run event: ${WORKFLOW_EVENT}"
          echo "Workflow run repository: ${WORKFLOW_REPO}"
          echo "Workflow run branch: ${WORKFLOW_BRANCH}"
          echo "Workflow run SHA: ${WORKFLOW_SHA}"

          if [ "${WORKFLOW_EVENT}" != "push" ]; then
            echo "ERROR: This workflow should only run for push events"
            exit 1
          fi

          if [ "${WORKFLOW_REPO}" != "${GITHUB_REPOSITORY}" ]; then
            echo "ERROR: Refusing to publish from a different repository"
            exit 1
          fi

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Checkout badges branch
        uses: actions/checkout@v4
        with:
          ref: badges
          path: badges

      - name: Download publish-site-content artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: publish-site-content
          path: ./artifacts/publish-site-content

      - name: Download publish-badges artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: publish-badges
          path: ./artifacts/publish-badges

      - name: Update gh-pages content
        working-directory: gh-pages
        run: |
          rm -rf typedoc/ lcov-report/
          mkdir -p typedoc lcov-report
          cp -r "${{ github.workspace }}/artifacts/publish-site-content/typedoc/." typedoc/
          cp -r "${{ github.workspace }}/artifacts/publish-site-content/lcov-report/." lcov-report/
          cp -r "${{ github.workspace }}/artifacts/publish-site-content/root-markdown/"*.md . || true

      - name: Update badges content
        working-directory: badges
        run: |
          cp -r "${{ github.workspace }}/artifacts/publish-badges/"*.svg . || true

      - name: Commit and Push gh-pages
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "Update Source Documentation"
          pull: "--rebase --autostash"
          cwd: gh-pages

      - name: Commit and Push the Badges to the badges branch
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "Push updated badges branch"
          add: "*.svg"
          pull: "--rebase --autostash"
          cwd: badges
